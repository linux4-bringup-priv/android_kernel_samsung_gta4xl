name: Kernel Build

on:
  workflow_dispatch:  # Manuel başlatma

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo'yu klonla
      uses: actions/checkout@v3

    - name: Gerekli bağımlılıkları yükle
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make \
          python3 python-is-python3 git zip unzip \
          ccache libncurses5-dev libncursesw5-dev \
          clang lld wget curl

    - name: build.sh çalıştır
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Image dosyasını artifact olarak yükle
      uses: actions/upload-artifact@v3
      with:
        name: Kernel-Image
        path: out/arch/arm64/boot/Image
